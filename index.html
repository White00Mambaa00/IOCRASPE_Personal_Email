<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Personal Website</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,Arial;background:#f5f6f8;color:#172033}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,680px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:750;letter-spacing:-.04em;font-size:22px}.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b7280}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.055em;margin:0 0 10px}p{color:#647084;line-height:1.6;margin:0 0 30px}.panel{background:white;border:1px solid #e3e6eb;border-radius:18px;box-shadow:0 18px 55px #1a26320c;overflow:hidden}.line{display:flex;align-items:center;border-bottom:1px solid #e9ebef;padding:0 24px;min-height:64px;gap:18px}label{font-size:14px;font-weight:650;color:#596477;min-width:56px}input,textarea{font:inherit;border:0;outline:0;width:100%;color:#172033;background:transparent}input{height:60px}textarea{resize:vertical;min-height:220px;padding:24px;width:100%;line-height:1.7}.foot{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e9ebef;gap:12px}.hint{font-size:12px;color:#8791a1}button{background:#172033;color:white;border:0;padding:13px 22px;border-radius:9px;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{margin-top:16px;font-size:14px;min-height:22px}.bottom{font-size:12px;color:#8b95a4;margin-top:28px;text-align:center}@media(max-width:500px){.foot{align-items:flex-start;flex-direction:column}.line{padding:0 16px}textarea{padding:18px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">CONTACT<span style="color:#9aa4b3">.</span></div><div class="tag">Private correspondence</div></header><h1>Start a conversation.</h1><p>Have a question, proposal, or something worth discussing? Send a message directly.</p><form id="contact" class="panel"><div class="line"><label for="to">To</label><input id="to" value="Private inbox" readonly aria-label="Recipient"></div><div class="line"><label for="subject">Subject</label><input id="subject" maxlength="150" placeholder="What is this regarding?" required></div><textarea id="message" maxlength="8000" placeholder="Write your message here..." aria-label="Message body" required></textarea><div class="foot"><span class="hint">Your message is delivered privately.</span><button id="send" type="submit">Send message ↗</button></div></form><div id="status" role="status" aria-live="polite"></div><div class="bottom">Thoughtful conversations begin here.</div></main><script>const ENDPOINT='REPLACE_WITH_WORKER_URL';const f=document.getElementById('contact'),s=document.getElementById('status'),b=document.getElementById('send');f.addEventListener('submit',async e=>{e.preventDefault();if(ENDPOINT.startsWith('REPLACE_')){s.textContent='Site owner: configure the secure relay endpoint before publishing.';return}b.disabled=true;s.textContent='Sending…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.getElementById('subject').value.trim(),message:document.getElementById('message').value.trim()})});if(!r.ok)throw Error('Delivery failed');s.textContent='Message sent successfully.';f.reset()}catch(e){s.textContent='Unable to send. Please try again later.'}finally{b.disabled=false}})</script></body></html>
